name: "Small Print check"
description: "Fails the build when a repository's MCP servers, skills or instruction files changed since smallprint.lock. Sends nothing."
author: "EmberStack LLC"
branding:
  icon: "file-text"
  color: "gray-dark"
inputs:
  lockfile:
    description: "Path to the lock written by `smallprint lock`"
    required: false
    default: "smallprint.lock"
  version:
    description: "smallprint CLI version to run"
    required: false
    default: "0.1.8"
  sarif:
    description: "Path to write a SARIF 2.1.0 log of what changed, for a code-scanning upload (empty: none)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Compare this checkout with the lock
      shell: bash
      # the inputs reach the shell as environment variables, never pasted into the script, so a value can only ever be
      # an argument (security audit of 29 Sep 2026, item 45); the version must look like a version
      env:
        SP_LOCKFILE: ${{ inputs.lockfile }}
        SP_VERSION: ${{ inputs.version }}
        SP_SARIF: ${{ inputs.sarif }}
      run: |
        if ! [[ "$SP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$ ]]; then
          echo "version must be a version number such as 0.1.5" >&2
          exit 2
        fi
        args=(check --locked --file "$SP_LOCKFILE" --no-upload --no-signup)
        if [ -n "$SP_SARIF" ]; then args+=(--sarif "$SP_SARIF"); fi
        npx -y "smallprint@$SP_VERSION" "${args[@]}"
