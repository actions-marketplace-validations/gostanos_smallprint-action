# Hooks for pre-commit (https://pre-commit.com). ops/deploy/mirror-cli.sh copies this file to the root of the public
# repository gostanos/smallprint-action, where pre-commit looks for it. The hooks run the pinned command with the
# machine's own npx (language: system), so pre-commit builds no Node environment: that path needed a package.json at the
# repository root, and with pre-commit 4.6 and npm 11.12 it failed with "Fetching non-root packages of type git have
# been disabled" (29 Sep 2026). Node 20 or later must be installed. The smallprint@ pin moves with
# ops/deploy/bump-cli.sh, and apps/web/test/cli-pin.test.ts fails if it is left behind.
- id: smallprint-locked
  name: smallprint check --locked
  description: Compares the MCP servers, skills and instruction files here with smallprint.lock, and fails with exit 2 when anything changed. It runs on this machine only and sends nothing.
  entry: npx -y smallprint@0.1.8 check --locked
  language: system
  pass_filenames: false
  always_run: true
- id: smallprint-lock
  name: smallprint lock --project
  description: Writes smallprint.lock for this repository. Run it by hand with "pre-commit run smallprint-lock --hook-stage manual", read the change, and commit it. It asks the record for each server's digest by registry name; add --offline under args to skip that.
  entry: npx -y smallprint@0.1.8 lock --project
  language: system
  pass_filenames: false
  always_run: true
  stages: [manual]
